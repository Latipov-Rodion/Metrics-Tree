<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="MetricTree — Калькулятор продуктовых метрик">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0C0E"/>
      <stop offset="100%" stop-color="#14171C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A6DF4"/>
      <stop offset="100%" stop-color="#2A6DF4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2A6DF4" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#2A6DF4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="100%" height="6" fill="url(#accent)"/>

  <!-- Logo mark -->
  <g transform="translate(72,84)">
    <rect width="64" height="64" rx="14" fill="#1A1C1F"/>
    <path d="M14 50 L14 30 L24 30 L24 50 Z" fill="url(#bar)"/>
    <path d="M27 50 L27 18 L37 18 L37 50 Z" fill="url(#bar)" opacity=".9"/>
    <path d="M40 50 L40 36 L50 36 L50 50 Z" fill="url(#bar)" opacity=".75"/>
    <path d="M10 52 L54 52" stroke="#2C2F33" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="14" r="6" fill="#4CAF50"/>
  </g>

  <text x="160" y="135" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="700" fill="#E8EAED">MetricTree</text>
  <text x="160" y="170" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" fill="#6b6f75">metricstree.vercel.app</text>

  <!-- Main headline -->
  <text x="72" y="280" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="#E8EAED">Калькулятор</text>
  <text x="72" y="358" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="#E8EAED">продуктовых метрик</text>

  <!-- Subline -->
  <text x="72" y="412" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#B0B3B8">35+ метрик · отраслевые пороги · What-If анализ · бесплатно</text>

  <!-- Metric pills -->
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="22" font-weight="600">
    <g transform="translate(72,478)">
      <rect width="100" height="50" rx="25" fill="#1A1C1F" stroke="#2A6DF4" stroke-width="2"/>
      <text x="50" y="33" text-anchor="middle" fill="#2A6DF4">LTV</text>
    </g>
    <g transform="translate(184,478)">
      <rect width="100" height="50" rx="25" fill="#1A1C1F" stroke="#2A6DF4" stroke-width="2"/>
      <text x="50" y="33" text-anchor="middle" fill="#2A6DF4">CAC</text>
    </g>
    <g transform="translate(296,478)">
      <rect width="100" height="50" rx="25" fill="#1A1C1F" stroke="#2A6DF4" stroke-width="2"/>
      <text x="50" y="33" text-anchor="middle" fill="#2A6DF4">MRR</text>
    </g>
    <g transform="translate(408,478)">
      <rect width="120" height="50" rx="25" fill="#1A1C1F" stroke="#2A6DF4" stroke-width="2"/>
      <text x="60" y="33" text-anchor="middle" fill="#2A6DF4">Churn</text>
    </g>
    <g transform="translate(540,478)">
      <rect width="100" height="50" rx="25" fill="#1A1C1F" stroke="#2A6DF4" stroke-width="2"/>
      <text x="50" y="33" text-anchor="middle" fill="#2A6DF4">NPS</text>
    </g>
    <g transform="translate(652,478)">
      <rect width="120" height="50" rx="25" fill="#1A1C1F" stroke="#2A6DF4" stroke-width="2"/>
      <text x="60" y="33" text-anchor="middle" fill="#2A6DF4">ROAS</text>
    </g>
  </g>

  <!-- Right-side decorative chart -->
  <g transform="translate(820,200)">
    <rect width="320" height="320" rx="20" fill="#1A1C1F" opacity=".7"/>
    <text x="20" y="40" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6b6f75">LTV : CAC</text>
    <text x="20" y="100" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#4CAF50">5.2x</text>
    <text x="20" y="135" font-family="Inter, sans-serif" font-size="16" fill="#B0B3B8">Отличное соотношение</text>
    <g transform="translate(20,170)">
      <rect width="40" height="100" fill="#2A6DF4" opacity=".5"/>
      <rect x="55" width="40" height="120" fill="#2A6DF4" opacity=".7"/>
      <rect x="110" width="40" height="80" fill="#2A6DF4" opacity=".6"/>
      <rect x="165" width="40" height="130" fill="#2A6DF4"/>
      <rect x="220" width="40" height="60" fill="#2A6DF4" opacity=".4"/>
    </g>
  </g>

  <!-- Footer -->
  <text x="72" y="586" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" fill="#6b6f75">Создатель: Родион Латыпов · BizDev, Sales, Product, Advisor</text>
</svg>
