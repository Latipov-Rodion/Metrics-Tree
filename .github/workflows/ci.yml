name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Guard against the #1 footgun of this no-bundler site: editing a source
  # (index.html / blog-src) without regenerating the committed artifacts.
  artifacts-in-sync:
    name: Build artifacts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.mjs derives sitemap <lastmod> (and the benchmarks "обновлено"
          # stamp) from the last commit touching each page's sources. A shallow
          # clone can't tell when an older file last changed, so fetch history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate all build artifacts
        run: |
          node build-industries.mjs
          node build-glossary.mjs
          node build.mjs
          node build-blog.mjs
          node inject-theme-sync.mjs
      - name: Fail if generated artifacts are stale
        # Dates are now derived from git history (deterministic), but a build
        # made just before midnight UTC and committed just after it would still
        # differ by one day on the date lines alone — keep ignoring those hunks
        # as a safety net. Everything else must match byte for byte.
        run: |
          if ! git diff --quiet -I'<lastmod>' -I'обновлено [0-9]{4}-[0-9]{2}-[0-9]{2}'; then
            echo "::error::Generated artifacts are out of sync with sources."
            echo "Run 'node build.mjs && node build-blog.mjs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi
          echo "✓ All generated artifacts match their sources."

  # Validate rewrites, sitemap reachability, internal blog links and hreflang twins.
  validate-site:
    name: Validate links & sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node validate-site.mjs

  # Unit tests for the public calculator API (api/calc.js formulas + handler).
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # app.js IS the application (all UI logic + all metric data) but nothing in
      # the pipeline parses it as JavaScript, so a syntax error there used to pass
      # every job green and ship a blank calculator. Parse it, plus the edge
      # functions and the build scripts, before running the tests.
      - name: Syntax-check application and API sources
        run: |
          node --check app.js
          node --check ab-test.js
          for f in api/*.js; do node --check "$f"; done
          for f in *.mjs; do node --check "$f"; done
      - run: node --test test/*.test.mjs

  # After a production deploy (push to main), notify Bing/Yandex via IndexNow.
  # Best-effort: a failed ping never fails the pipeline (it's a notification,
  # not a correctness gate). Skipped on pull_request runs.
  indexnow:
    name: Ping IndexNow (Bing/Yandex)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs the pre-push sitemap.xml to diff against
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Submit only URLs that are new or whose <lastmod> changed in this push
      # (IndexNow asks for changed URLs, not the whole sitemap on every push).
      - run: node notify-indexnow.mjs --since "${{ github.event.before }}"
        continue-on-error: true
